[project]
name = "strategic-memory-crm"
version = "1.2.0"
description = "Behavioral intelligence CRM platform and MCP server modeling trust dynamics, negotiation patterns, influence structures, and relationship risk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "ADA Creative Co.", email = "hello@adacreative.co" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "crm",
    "relationship-intelligence",
    "strategic-memory",
    "networkx",
    "trust-dynamics",
    "behavioral-intelligence",
    "negotiation-analysis",
    "organizational-politics",
    "graph-analysis",
    "flask",
    "claude",
    "cursor",
    "llm"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "flask>=3.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "mcp[cli]>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/adacreativeco/strategic-memory-crm"
Repository = "https://github.com/adacreativeco/strategic-memory-crm"
Documentation = "https://github.com/adacreativeco/strategic-memory-crm#readme"
"Bug Tracker" = "https://github.com/adacreativeco/strategic-memory-crm/issues"

[project.scripts]
strategic-memory-crm = "mcp_server:main"
strategic-memory-mcp = "mcp_server:main"
strategic-crm = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mcp_server.py",
    "app.py",
    "strategic_memory_crm/**/*.py",
    "templates/**/*",
    "static/**/*",
    "data/**/*",
    "*.png"
]
