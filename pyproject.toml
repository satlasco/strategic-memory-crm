[project]
name = "strategic-memory-crm"
version = "1.0.0"
description = "Behavioral intelligence CRM platform modeling trust dynamics, negotiation patterns, influence structures, and relationship risk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "ADA Creative Co.", email = "hello@adacreative.co" }
]
keywords = [
    "crm",
    "relationship-intelligence",
    "strategic-memory",
    "networkx",
    "trust-dynamics",
    "behavioral-intelligence",
    "negotiation-analysis",
    "organizational-politics",
    "graph-analysis",
    "flask",
    "llm",
    "gemini",
    "openai",
    "claude"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "flask>=3.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/adacreativeco/strategic-memory-crm"
Repository = "https://github.com/adacreativeco/strategic-memory-crm"
Documentation = "https://github.com/adacreativeco/strategic-memory-crm#readme"
"Bug Tracker" = "https://github.com/adacreativeco/strategic-memory-crm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
